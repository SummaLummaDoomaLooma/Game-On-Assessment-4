<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stellar Galactus</title>

  <style>
    /* ===================================================
       CSS = how the page LOOKS
       =================================================== */

    /* Keeps the page away from the edges of phone screens */
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Dark page, white text, everything in the middle */
    body {
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* The game screen: black with a white border */
    canvas {
      background: black;
      border: 2px solid white;
      max-width: 100%;
    }
  </style>
</head>

<body>

  <!-- HTML = what is ON the page -->
  <h1>Stellar Galactus</h1>

  <!-- The canvas is the game screen. We draw on it with JavaScript. -->
  <canvas id="game" width="600" height="600"></canvas>

  <p>Left / Right arrows (or A / D) to move. Space to shoot.</p>



  <script>
    /* ===================================================
       JAVASCRIPT = how the game WORKS
       =================================================== */


    /* ---------------------------------------------------
       PART 1: SETUP
       Get the canvas and make our game variables.
       --------------------------------------------------- */

    // Find the canvas on the page
    var canvas = document.getElementById("game");

    // "ctx" is the pen we use to draw on the canvas
    var ctx = canvas.getContext("2d");


    // What screen are we on? It can be:
    // "start", "playing", "levelup", "over" or "win"
    var gameState = "start";

    // Which level we are on (1, 2 or 3)
    var level = 1;

    // Points scored
    var score = 0;

    // How many lives the player has left
    var lives = 3;

    // How many things we have destroyed on this level
    var kills = 0;

    // How many things we must destroy to finish this level
    var killsNeeded = 8;

    // Counts up every frame. When it gets big enough, a new thing appears.
    var spawnTimer = 0;


    // The player's ship.
    // x and y are the top left corner of the ship.
    var player = {
      x: 280,
      y: 540,
      width: 40,
      height: 30
    };


    // Lists (arrays) that hold everything in the game
    var bullets = [];   // bullets we have shot
    var rocks = [];     // asteroids
    var enemies = [];   // enemy spaceships


    // This remembers which keys are being held down
    var keys = {};


    /* ---------------------------------------------------
       PART 2: STARTING A LEVEL
       This gets everything ready for a new level.
       --------------------------------------------------- */

    function startLevel() {

      // Start counting kills from zero
      kills = 0;

      // Harder levels need more kills:
      // level 1 = 8, level 2 = 11, level 3 = 14
      killsNeeded = 5 + level * 3;

      // Reset the spawn timer
      spawnTimer = 0;

      // Empty all the lists so the screen is clear
      bullets = [];
      rocks = [];
      enemies = [];

      // Put the player back in the middle
      player.x = 280;

      // Now the game can begin!
      gameState = "playing";
    }


    /* ---------------------------------------------------
       PART 3: KEYBOARD CONTROLS
       --------------------------------------------------- */

    // This runs every time a key is PRESSED DOWN
    document.addEventListener("keydown", function (e) {

      // Remember that this key is being held
      keys[e.key.toLowerCase()] = true;


      // SPACE = shoot a bullet (only while playing)
      if (e.key === " " && gameState === "playing") {

        // Make a new bullet at the front of the ship
        var newBullet = {
          x: player.x + 18,
          y: player.y,
          width: 4,
          height: 12
        };

        // Add it to the bullets list
        bullets.push(newBullet);
      }


      // ENTER = start the game or go to the next level
      if (e.key === "Enter") {

        if (gameState === "levelup") {
          // We beat a level, so start the next one
          startLevel();
        }
        else if (gameState !== "playing") {
          // We are on the start, game over or win screen,
          // so reset everything and begin a new game
          level = 1;
          score = 0;
          lives = 3;
          startLevel();
        }
      }


      // Stop the page from scrolling when we press space or arrows
      if (e.key === " " || e.key.indexOf("Arrow") === 0) {
        e.preventDefault();
      }
    });


    // This runs every time a key is LET GO
    document.addEventListener("keyup", function (e) {

      // Remember that this key is no longer held
      keys[e.key.toLowerCase()] = false;
    });




    /* ---------------------------------------------------
       PART 4: HELPER FUNCTIONS
       Small jobs that the rest of the game uses.
       --------------------------------------------------- */

    // Do two boxes touch each other?
    // Returns true if they overlap, false if they don't.
    function hit(a, b) {
      return (
        a.x < b.x + b.width &&    // a's left side is left of b's right side
        a.x + a.width > b.x &&    // a's right side is right of b's left side
        a.y < b.y + b.height &&   // a's top is above b's bottom
        a.y + a.height > b.y      // a's bottom is below b's top
      );
    }


    // Add a new rock or enemy at the top of the screen
    function spawn() {

      // Make a box at a random spot across the top
      var thing = {
        x: Math.random() * 560,
        y: -40,
        width: 40,
        height: 40
      };

      // Level 1 only has rocks.
      // On other levels it is a 50/50 chance of a rock or an enemy.
      if (level === 1 || Math.random() < 0.5) {
        rocks.push(thing);
      }
      else {
        enemies.push(thing);
      }
    }


    // Move bullets UP the screen
    function moveBullets() {

      // We loop BACKWARDS so we can safely remove bullets as we go
      for (var i = bullets.length - 1; i >= 0; i--) {

        // Move this bullet up by 8
        bullets[i].y -= 8;

        // If it left the top of the screen, delete it
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
        }
      }
    }


    // Move a list of rocks or enemies DOWN the screen
    function moveDown(list, speed) {

      // Loop backwards again so removing is safe
      for (var i = list.length - 1; i >= 0; i--) {

        // Move this thing down by "speed"
        list[i].y += speed;

        // If it went off the bottom of the screen, delete it
        if (list[i].y > 600) {
          list.splice(i, 1);
        }
      }
    }


    // Check if any bullet hit anything in a list (rocks or enemies)
    function shootThings(list) {

      // Go through every rock/enemy in the list
      for (var i = list.length - 1; i >= 0; i--) {

        // For each one, go through every bullet
        for (var j = bullets.length - 1; j >= 0; j--) {

          // Did this bullet touch this thing?
          if (hit(bullets[j], list[i])) {

            bullets.splice(j, 1);   // the bullet is used up, remove it
            list.splice(i, 1);      // the rock/enemy is destroyed, remove it

            score += 10;            // get 10 points
            kills += 1;             // one step closer to beating the level

            break;                  // this thing is gone, so stop checking bullets
          }
        }
      }
    }


    // Check if the player crashed into anything in a list
    function crashCheck(list) {

      for (var i = list.length - 1; i >= 0; i--) {

        // Did the player touch this thing?
        if (hit(player, list[i])) {

          list.splice(i, 1);   // remove the thing we crashed into
          lives -= 1;          // lose a life
        }
      }
    }
